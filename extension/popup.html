<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-primary: #ffd700;
      --gold-dark: #c5a059;
      --gold-gradient: linear-gradient(135deg, #ffd700, #c5a059);
      --bg-deep: #050505;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-glass: rgba(10, 10, 10, 0.7);
      --border-thin: rgba(255, 215, 0, 0.12);
      --text-main: #f0f0f0;
      --text-muted: #888;
      --accent-glow: rgba(255, 215, 0, 0.08);
    }

    body {
      width: 440px;
      margin: 0;
      padding: 0;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.01em;
      overflow: hidden;
    }

    /* --- Layout Components --- */
    .header {
      background: var(--bg-glass);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-thin);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .title {
      font-size: 13px;
      font-weight: 800;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .title::before {
      content: 'V';
      background: var(--gold-gradient);
      color: black;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      font-weight: 900;
    }

    .container {
      padding: 20px;
      max-height: 480px;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }

    /* --- URL Item & List --- */
    .url-item {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 10px;
      font-size: 12px;
      position: relative;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      animation: staggerIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* --- Platform Promo Card --- */
    .platform-promo {
      background: rgba(255, 215, 0, 0.03) !important;
      border: 1px solid rgba(255, 215, 0, 0.1) !important;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .promo-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .promo-label {
      font-size: 11px;
      font-weight: 900;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .promo-desc {
      font-size: 12px;
      color: #aaa;
      line-height: 1.6;
      border-left: 2px solid rgba(255, 215, 0, 0.2);
      padding-left: 12px;
    }

    @keyframes staggerIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .url-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      height: 60%;
      width: 3px;
      background: var(--gold-gradient);
      border-radius: 0 10px 10px 0;
      opacity: 0.2;
      transition: opacity 0.4s;
    }

    .url-item:hover {
      border-color: rgba(255, 215, 0, 0.3);
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-4px) scale(1.005);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 10px 30px var(--accent-glow);
    }

    .url-item:hover::before {
      opacity: 1;
    }

    /* --- Buttons --- */
    button {
      background: var(--gold-gradient);
      color: black;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover {
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(0.95);
    }

    .clear-btn {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      transition: all 0.3s;
    }

    .clear-btn:hover {
      background: rgba(255, 215, 0, 0.1);
      color: var(--gold-primary);
      border-color: var(--gold-primary);
    }

    /* --- Search --- */
    .search-container {
      padding: 20px 24px;
      background: var(--bg-deep);
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .search-bar {
      width: 100%;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 215, 0, 0.15);
      color: var(--gold-primary);
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-bar:focus {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--gold-primary);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transform: scale(1.005);
    }

    .search-bar::placeholder { color: #333; }

    /* --- Record Panel --- */
    #record-test-panel {
      background: rgba(255, 40, 40, 0.04);
      border-bottom: 1px solid rgba(255, 60, 60, 0.12);
      padding: 10px 20px;
      position: relative;
      z-index: 5;
    }

    #record-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      display: inline-block;
      transition: all 0.3s;
    }

    #record-timer {
      font-family: 'Outfit', sans-serif;
      color: #ff5252;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid rgba(255, 82, 82, 0.2);
    }

    #record-start-btn, #record-stop-btn, #record-save-video-btn, #record-extract-audio-btn {
      border-radius: 10px !important;
      padding: 6px 14px !important;
      font-size: 10px !important;
    }

    #record-start-btn {
      background: rgba(255, 60, 60, 0.15) !important;
      color: #ff5252 !important;
      border: 1px solid rgba(255, 60, 60, 0.3) !important;
    }

    #record-start-btn:hover {
      background: #ff5252 !important;
      color: white !important;
      box-shadow: 0 0 15px rgba(255, 82, 82, 0.4);
    }

    #record-stats {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.1);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-size: 10px;
      color: #aaa;
      line-height: 1.8;
      display: none;
    }

    #record-stats b {
      margin: 0 5px;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* --- UI Components --- */
    #toastContainer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: var(--gold-primary);
      color: #000;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 15px 45px rgba(255, 215, 0, 0.3);
      animation: toastIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(40px) scale(0.8); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .container::-webkit-scrollbar { width: 4px; }
    .container::-webkit-scrollbar-thumb {
      background: rgba(255, 215, 0, 0.15);
      border-radius: 10px;
    }

    /* --- Video Preview --- */
    .inline-preview {
      display: none;
      position: relative;
      width: 100%;
      background: #000;
      margin-top: 16px;
      border-radius: 10px;
      border: 1px solid var(--gold-dark);
      overflow: hidden;
      animation: expandDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes expandDown {
      from { max-height: 0; opacity: 0; }
      to { max-height: 300px; opacity: 1; }
    }

    .inline-preview video { width: 100%; height: 210px; display: block; }

    .preview-close, .preview-snapshot {
      cursor: pointer;
      color: var(--gold-primary);
      font-weight: 800;
      font-size: 10px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      background: rgba(255, 215, 0, 0.05);
      transition: all 0.2s;
    }

    .preview-close:hover { background: var(--gold-primary); color: #000; }

    /* --- Progress System --- */
    .progress-container {
      display: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin-top: 16px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--gold-gradient);
      box-shadow: 0 0 10px var(--gold-primary);
      transition: width 0.4s ease;
      animation: breathing-glow 1.6s ease-in-out infinite;
    }

    @keyframes breathing-glow {
      0%, 100% { box-shadow: 0 0 6px rgba(255, 215, 0, 0.4); }
      50% { box-shadow: 0 0 16px rgba(255, 215, 0, 0.9); }
    }

    @keyframes breathing-dot {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.7); }
      50% { transform: scale(1.2); box-shadow: 0 0 10px 3px rgba(255, 82, 82, 0.4); }
    }

    .gold-btn {
      width: 100%;
      min-height: 40px;
      padding: 10px 20px;
      background: var(--gold-primary);
      color: #000;
      font-weight: 800;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 11px;
      white-space: nowrap;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
    }

    .gold-btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
      transform: translateY(-2px);
    }

    .outline-btn {
      flex: 1;
      background: transparent;
      color: var(--gold-primary);
      border: 1px solid var(--gold-primary);
      font-size: 10px;
      min-height: 40px;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }

    .outline-btn:hover {
      background: rgba(255, 215, 0, 0.05);
      transform: translateY(-2px);
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions button {
      flex: 1;
      min-width: 80px;
      white-space: nowrap;
    }

    .companion-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      width: 100%;
    }

    #compMerge {
      flex: 9;
      min-height: 40px;
      padding: 10px 0; /* Clear huge horizontal padding if set via class to ensure flex takes over */
    }

    #compCopy {
      flex: 1;
      min-height: 40px;
      padding: 10px 0;
    }

    .record-indicator-breathing {
      background: #ff5252 !important;
      animation: breathing-dot 1.2s ease-in-out infinite;
    }

    .progress-text {
      font-size: 10px;
      color: var(--gold-primary);
      margin-top: 8px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
    }

    /* --- Modular Elements --- */
    .item-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .protocol-tag { background: #222; color: var(--gold-primary); padding: 2px 6px; border-radius: 10px; font-size: 9px; font-weight: 900; }
    .item-title { font-size: 13px; font-weight: 600; color: #fff; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge-video { background: rgba(0, 170, 255, 0.1); color: #00aaff; padding: 2px 6px; border-radius: 10px; font-size: 9px; }
    .badge-audio { background: rgba(255, 0, 255, 0.1); color: #ff00ff; padding: 2px 6px; border-radius: 10px; font-size: 9px; }
    .item-meta { color: #555; font-size: 10px; margin-bottom: 8px; }
    .quality-tag { background: #111; color: var(--gold-primary); border: 1px solid #333; padding: 4px 8px; border-radius: 10px; font-size: 10px; cursor: pointer; transition: 0.2s; }
    .quality-tag:hover { background: var(--gold-primary); color: #000; border-color: var(--gold-primary); }

    /* --- Toggles --- */
    .toggle-wrapper { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .toggle-input { display: none; }
    .toggle-slider {
      position: relative; display: inline-block; width: 28px; height: 16px;
      background-color: rgba(255, 255, 255, 0.05); border-radius: 10px; transition: 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .toggle-input:checked + .toggle-slider { background-color: rgba(255, 215, 0, 0.2); border-color: var(--gold-primary); }
    .toggle-slider::after {
      content: ''; position: absolute; width: 10px; height: 10px; border-radius: 50%;
      background-color: #555; top: 2px; left: 2px; transition: 0.3s;
    }
    .toggle-input:checked + .toggle-slider::after { left: 14px; background-color: var(--gold-primary); box-shadow: 0 0 8px var(--gold-primary); }
  </style>
</head>

<body>
  <div class="header">
    <div class="title" data-i18n="appName">Sovereign Sniffer</div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button class="clear-btn" id="perfToggle" title="High Performance Mode">🚀</button>
      <button class="clear-btn" id="langToggle">🌐</button>
      <button class="clear-btn" id="clearBtn" data-i18n="clearBtn">Clear</button>
    </div>
  </div>

  <div id="global-merge-banner"
    style="display:none; background: linear-gradient(90deg, #111, #222); border-bottom: 1px solid var(--gold-dark); padding: 12px 20px; animation: slideDown 0.4s ease; position: relative; overflow: hidden;">
    <div id="export-write-warning" style="display:none; color:#f44336; font-size:9px; font-weight:800; text-align:center; padding: 0 0 6px 0; letter-spacing:0.5px; position:relative; z-index:2;">⚠️ 正在保存，请勿关闭插件弹窗</div>
    <div style="display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="global-spinner" style="font-size: 14px; animation: spin 2s linear infinite;">⚙️</span>
        <div style="display: flex; flex-direction: column;">
          <span id="global-stage" data-i18n="mergingInProgress"
            style="color: var(--gold-primary); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">MERGING
            IN PROGRESS</span>
          <span id="global-msg" data-i18n="sovereignSandbox"
            style="color: #888; font-size: 9px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px;">Sovereign
            Sandbox is active...</span>
        </div>
      </div>
      <div id="global-pct"
        style="color: var(--gold-primary); font-size: 16px; font-weight: 900; font-family: monospace;">0%</div>
      <button id="global-cancel-btn" class="clear-btn"
        style="background: rgba(244, 67, 54, 0.1); color: #f44336; border-color: rgba(244, 67, 54, 0.2); padding: 4px 8px; font-size: 9px; margin-left: 10px;">✕</button>
    </div>
    <div id="global-bar-bg"
      style="position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: rgba(255, 215, 0, 0.05);">
      <div id="global-bar"
        style="width: 0%; height: 100%; background: var(--gold-primary); box-shadow: 0 0 10px var(--gold-primary); transition: width 0.4s ease;">
      </div>
    </div>
  </div>

  <!--
    Phase 1 Prototype: Transferable Frame Transfer Validation Panel
    Shows real-time stats from the Record Worker (fps, resolution, frame count).
    Will evolve into the full recording control UI in later phases.
  -->
  <div id="record-test-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="record-indicator"></span>
        <span data-i18n="recordTabTitle" style="font-size:10px; color:#c5a059; font-weight:800; text-transform:uppercase; letter-spacing:1px;">录制</span>
        <span id="record-timer" style="display:none; font-family:monospace; color:#ff5252; font-size:9px; font-weight:800; letter-spacing:0.5px; padding:2px 5px; border-radius:10px; background:rgba(255,82,82,0.08);">00:00:00</span>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        <label for="record-audio-only" class="toggle-wrapper" title="Only record audio">
          <input type="checkbox" id="record-audio-only" class="toggle-input">
          <span class="toggle-slider"></span>
          <span data-i18n="recordAudioOnly" style="font-size:9px; color:#ab47bc; font-weight:700; letter-spacing:0.3px;">仅录音</span>
        </label>
        <select id="record-quality" style="background:#111; color:#888; border:1px solid rgba(255,255,255,0.1); border-radius:10px; font-size:9px; font-weight:700; padding:3px 6px; cursor:pointer; outline:none;">
          <option value="UHD" data-i18n="recordQualityUHD">原画</option>
          <option value="1080P" selected>1080P</option>
          <option value="720P">720P</option>
        </select>
        <button id="record-start-btn" data-i18n="recordStart" style="padding:4px 12px; font-size:9px;">开始</button>
        <button id="record-stop-btn" data-i18n="recordStop" disabled style="padding:4px 12px; font-size:9px;">停止</button>
        <button id="record-save-video-btn" data-i18n="recordSaveVideo" style="display:none; padding:4px 12px; font-size:9px;">保存视频</button>
        <button id="record-extract-audio-btn" data-i18n="recordExtractAudio" style="display:none; padding:4px 12px; font-size:9px;">提取音频</button>
      </div>
    </div>
    <div id="record-stats"></div>
  </div>

  <div class="search-container">
    <input type="search" id="searchBar" class="search-bar" placeholder="Search by title..."
      data-i18n="searchPlaceholder">
  </div>
  <div class="container" id="urlList">
    <div class="empty-state" data-i18n="noMedia">No streams detected yet. Start playing a video!</div>
  </div>
  <div class="footer"
    style="padding: 12px 20px; border-top: 1px solid rgba(255, 255, 255, 0.03); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2);">
    <div style="font-size: 10px; color: #555; font-weight: 500;" data-i18n="footerNote">CMD: CLI command for
      yt-dlp/ffmpeg</div>
    <div style="font-size: 9px; color: #444; font-weight: 800; letter-spacing: 1px;" data-version>V1.37.0</div>
  </div>
  <div id="toastContainer"></div>
  <script src="hls.min.js"></script>
  <script src="dash.all.min.js"></script>
  <script type="module" src="js/popup/main.js"></script>
</body>

</html>
