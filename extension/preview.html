<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sovereign Preview - Media Sniffer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');

    :root {
      --gold: #FFD700;
      --gold-dark: #B8860B;
      --bg: #0a0a0a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --glass: rgba(255, 255, 255, 0.05);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: white;
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    #player-container {
      position: relative;
      width: 90%;
      max-height: 80vh;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid var(--gold-dark);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: aspect-ratio 0.3s ease;
    }

    video {
      width: 100%;
      height: 100%;
      outline: none;
      transform-origin: center center;
      transition: transform 0.3s ease;
      object-fit: contain;
    }

    #info-bar {
      width: 90%;
      margin-top: 20px;
      padding: 15px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      border-left: 4px solid var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-weight: 700;
      font-size: 18px;
      color: var(--gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }

    .status {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
      background: var(--gold);
      color: black;
      border: none;
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 12px;
      z-index: 100;
      transition: transform 0.2s;
    }

    .close-btn:hover {
      transform: scale(1.05);
    }

    .snapshot-btn {
      background: var(--gold);
      color: black;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .snapshot-btn:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
    }

    .snapshot-btn:active {
      transform: translateY(0);
    }

    .rotation-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .rotation-btn {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold-dark);
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      width: 40px;
      height: 36px;
      line-height: 1;
    }

    .rotation-btn:hover {
      background: rgba(255, 215, 0, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.2);
    }

    .rotation-btn:active {
      transform: translateY(0);
    }

    .rotation-btn.reset {
      font-size: 12px;
      width: 36px;
    }

    .rotation-btn.reset.disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
      border-color: rgba(184, 134, 11, 0.3);
    }

    .angle-display {
      font-size: 11px;
      color: rgba(255,215,0,0.6);
      text-align: center;
      min-width: 28px;
      user-select: none;
    }

    #error-msg {
      display: none;
      color: #ff4444;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <button class="close-btn" id="close-btn">✕</button>

  <div id="player-container">
    <video id="video-player" controls crossorigin="anonymous"></video>
    <div id="error-msg">Failed to load media. Signature or CORS restriction.</div>
  </div>

  <div id="info-bar">
    <div class="title-status-group" style="display: flex; flex-direction: column; min-width: 0; flex: 1;">
      <div class="title" id="video-title" style="max-width: 100%;">Loading Stream...</div>
      <div class="status" id="video-status">Detecting Format</div>
    </div>
    <div class="rotation-group" id="rotation-group">
      <button class="rotation-btn" id="rotate-left" title="左旋 90°">↺</button>
      <span class="angle-display" id="angle-display">0°</span>
      <button class="rotation-btn" id="rotate-right" title="右旋 90°">↻</button>
      <button class="rotation-btn reset disabled" id="reset-rotation" title="重置">⟲</button>
    </div>
    <button id="snapshot-btn" class="snapshot-btn">
      拍照
    </button>
  </div>

  <script src="hls.min.js"></script>
  <script src="dash.all.min.js"></script>
  <script src="preview.js"></script>
</body>
</html>
